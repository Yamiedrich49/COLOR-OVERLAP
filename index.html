<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f5f8" />
<title>COLOR OVERLAP｜15問の比較実験</title>
<style>
:root{--ink:#252b39;--sub:#777f90;--stroke:#dfe3eb;--paper:#ffffff;--bg:#f4f5f8;--accent:#3745d4;--red:#ef6c79;--blue:#6a90ed;--yellow:#eec55c;--purple:#a17bc6;--orange:#ee9b63;--green:#69b8a8;--triple:#68617d}
*{box-sizing:border-box}html{height:100%}body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent} .shell{max-width:470px;margin:auto;padding:19px 16px 26px} .top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 1px 16px}.brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:850;letter-spacing:.035em}.mark{position:relative;width:34px;height:31px}.mark i{position:absolute;border-radius:9px;width:25px;height:25px;opacity:.92}.mark i:first-child{background:var(--red);left:1px;top:1px}.mark i:nth-child(2){background:var(--blue);left:9px;top:6px;mix-blend-mode:multiply}.mark i:nth-child(3){background:var(--yellow);left:1px;top:7px;mix-blend-mode:multiply;opacity:.54}.tag{font-size:11px;border-radius:20px;background:#e7eaf2;color:#68718a;padding:6px 10px;font-weight:700;white-space:nowrap}
.modes{display:grid;grid-template-columns:repeat(3,1fr);background:#e8ebf0;padding:5px;border-radius:15px;gap:4px;margin-bottom:16px}.mode{border:0;background:transparent;color:#778095;border-radius:11px;padding:10px 4px;display:grid;gap:3px;text-align:center;line-height:1.25}.mode.active{background:white;color:#272e3e;box-shadow:0 2px 7px #29314b12}.mode strong{font-size:13px}.mode small{font-size:10px;white-space:nowrap}
.paper{background:white;border-radius:23px;padding:17px 15px 15px;box-shadow:0 9px 35px #18223a0b;border:1px solid #e9ecf1}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:5px}.kicker{font-size:11px;color:#8990a0;letter-spacing:.12em;font-weight:800}.heading h1{font-size:20px;line-height:1.2;margin:4px 0 0;letter-spacing:-.035em}.number{font-size:12px;color:#767f90;white-space:nowrap;font-weight:750}.dots{display:flex;gap:7px;margin-bottom:16px}.dot{width:29px;height:5px;border:0;padding:0;background:#e4e8f0;border-radius:99px}.dot.active{background:#4351cb}.dot.done:not(.active){background:#75b9a0}.rule{color:#787f8f;font-size:12px;margin:0 0 10px}.targets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:16px}.targets.seven{grid-template-columns:repeat(4,minmax(0,1fr))}.target{background:#f5f6f9;border:1px solid #edf0f4;border-radius:11px;padding:9px 5px;display:flex;align-items:center;justify-content:center;gap:5px;min-width:0}.target .swatch{width:12px;height:12px;border-radius:4px;flex:none}.target .word{font-size:11px;color:#737c89;white-space:nowrap}.target b{font-size:18px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.boardwrap{border-radius:16px;border:1px solid #e7eaf1;background:#fcfcfd;padding:9px;overflow:hidden}.board{width:100%;display:block;aspect-ratio:1;touch-action:none;user-select:none;cursor:grab}.board:active{cursor:grabbing}
.controlheading{display:flex;align-items:center;justify-content:space-between;margin:14px 0 9px}.controlheading span{font-size:11px;color:#7c8595}.controlheading strong{font-size:12px;color:#737c89}.pieces{display:flex;gap:7px}.piece{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 3px;border:1.5px solid #e6e8ed;border-radius:12px;background:#fff;color:#697282;font-size:13px;font-weight:750;min-width:0}.piece .swatch{width:13px;height:13px;border-radius:4px;flex:none}.piece.active{border-color:#535d80;background:#f7f8fc;color:#272f3f;box-shadow:0 0 0 1px #545f8019}.piece small{font-size:11px;font-weight:600;color:#939ba7}
.actions{display:grid;grid-template-columns:110px 1fr;gap:9px;margin-top:14px}.secondary,.primary{height:48px;border-radius:13px;border:none;font-size:14px;font-weight:800}.secondary{background:#eff1f5;color:#636d7f}.primary{background:#3c49cc;color:#fff;box-shadow:0 4px 12px #3c49cc26}.primary:active{transform:scale(.99)}
.result{margin-top:13px;padding:12px;background:#faf9f6;border:1px solid #ebe7df;border-radius:13px;display:none}.result.show{display:block}.result.win{background:#f3f9f6;border-color:#cfe7db}.result-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin-bottom:8px}.result-sub{font-size:11px;color:#78808c;line-height:1.5;margin:0 0 10px}.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.scores.seven{grid-template-columns:repeat(4,minmax(0,1fr))}.score{display:flex;align-items:center;gap:4px;justify-content:center;border-radius:8px;background:white;padding:8px 4px;font-size:11px;white-space:nowrap}.score .swatch{width:9px;height:9px;border-radius:3px}.score b{font-size:13px;font-variant-numeric:tabular-nums}.score.good b{color:#33876c}.score.bad b{color:#cf6956}
.footer-note{font-size:11px;line-height:1.65;text-align:center;color:#8b94a3;margin:12px 0 0}.under{display:flex;align-items:center;justify-content:space-between;margin:15px 3px 0;gap:10px}.plain{border:0;background:transparent;color:#848b9a;font-size:12px;padding:7px 3px}.hint{font-size:11px;color:#959caa}.compare{margin:16px 1px 0;background:#fff;border:1px solid #e4e8ef;border-radius:16px;padding:14px 15px}.compare strong{font-size:12px}.compare p{font-size:12px;line-height:1.7;color:#6c7484;margin:6px 0 0}.compare .small{font-size:11px;color:#989eaa}.disabled{opacity:.5}
@media(max-width:360px){.shell{padding:14px 10px 18px}.paper{padding:14px 11px}.target{padding:8px 3px;gap:4px}.target b{font-size:16px}.target .word{font-size:10px}.targets.seven .target{gap:3px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><span class="mark"><i></i><i></i><i></i></span>OVERLAP</div><div class="tag">PLAYTEST / 15 PUZZLES</div></header>
<div class="modes" id="modes"></div>
<main class="paper">
 <div class="heading"><div><div class="kicker" id="modeLabel">EXPERIMENT A</div><h1>色の面積をそろえる</h1></div><div class="number" id="stageLabel">01 / 05</div></div>
 <div class="dots" id="steps"></div>
 <p class="rule">目標の面積（マス数）に重ねよう</p>
 <div class="targets" id="targets"></div>
 <div class="boardwrap"><canvas class="board" id="board" width="720" height="720" aria-label="図形をドラッグして重ねる6×6の盤面"></canvas></div>
 <div class="controlheading"><strong>動かす図形</strong><span>タップで選択・ドラッグで移動</span></div>
 <div class="pieces" id="pieces"></div>
 <div class="result" id="result" aria-live="polite"></div>
 <div class="actions"><button class="secondary" id="reset">もとに戻す</button><button class="primary" id="judge">答え合わせ</button></div>
 <p class="footer-note">動かしただけでは数字は変わりません。<br>答え合わせの後に各色の面積が表示されます。</p>
</main>
<div class="under"><span class="hint" id="sinfo"></span><button class="plain" id="showAnswer">配置例を見る</button></div>
<div class="compare"><strong id="compareTitle">A｜長方形2枚</strong><p id="compareText"></p><p class="small">※ 解答は全問、総当たりで存在を確認済み。</p></div>
</div>
<script>
'use strict';
const DATA = {"stages":[{"mode":"A","shapes":["sq3","rect23"],"target":[7,4,2],"start":[[0,0],[3,0]],"answer":[[0,0],[2,0]],"solutionCount":68,"positions":320,"id":1},{"mode":"A","shapes":["sq3","sq3"],"target":[3,3,6],"start":[[0,0],[3,0]],"answer":[[0,0],[1,0]],"solutionCount":48,"positions":256,"id":2},{"mode":"A","shapes":["rect24","rect42"],"target":[4,4,4],"start":[[0,0],[4,0]],"answer":[[0,0],[2,0]],"solutionCount":81,"positions":225,"id":3},{"mode":"A","shapes":["rect32","rect24"],"target":[4,6,2],"start":[[0,0],[2,0]],"answer":[[0,0],[1,0]],"solutionCount":86,"positions":300,"id":4},{"mode":"A","shapes":["rect24","sq3"],"target":[5,6,3],"start":[[0,0],[3,2]],"answer":[[0,0],[1,1]],"solutionCount":36,"positions":240,"id":5},{"mode":"B","shapes":["L5","rect23"],"target":[2,3,3],"start":[[0,0],[3,0]],"answer":[[0,0],[0,2]],"solutionCount":24,"positions":320,"id":6},{"mode":"B","shapes":["L5","L5"],"target":[3,3,2],"start":[[0,0],[3,0]],"answer":[[0,0],[1,0]],"solutionCount":48,"positions":256,"id":7},{"mode":"B","shapes":["L6","rect24"],"target":[3,5,3],"start":[[0,0],[2,0]],"answer":[[0,0],[0,1]],"solutionCount":27,"positions":225,"id":8},{"mode":"B","shapes":["L6b","T5"],"target":[2,1,4],"start":[[0,0],[3,0]],"answer":[[1,0],[0,0]],"solutionCount":9,"positions":192,"id":9},{"mode":"B","shapes":["S6","L5"],"target":[3,2,3],"start":[[0,1],[3,0]],"answer":[[0,0],[2,0]],"solutionCount":26,"positions":192,"id":10},{"mode":"C","shapes":["rect23","rect23","rect23"],"target":[2,0,2,2,0,2,2],"start":[[0,0],[3,0],[0,4]],"answer":[[0,0],[1,0],[2,0]],"solutionCount":20,"positions":8000,"id":11},{"mode":"C","shapes":["sq3","rect23","rect32"],"target":[6,4,1,4,1,0,1],"start":[[0,0],[3,0],[0,3]],"answer":[[0,0],[2,1],[1,2]],"solutionCount":16,"positions":6400,"id":12},{"mode":"C","shapes":["sq3","L5","rect23"],"target":[5,1,1,1,2,2,1],"start":[[0,0],[3,0],[0,4]],"answer":[[0,0],[1,1],[0,2]],"solutionCount":9,"positions":5120,"id":13},{"mode":"C","shapes":["L5","T5","L5"],"target":[2,1,1,1,1,2,1],"start":[[0,0],[3,0],[0,3]],"answer":[[0,0],[0,0],[1,0]],"solutionCount":20,"positions":4096,"id":14},{"mode":"C","shapes":["L6","L6b","plus5"],"target":[2,2,1,1,1,1,2],"start":[[0,0],[3,0],[0,3]],"answer":[[1,1],[1,0],[0,0]],"solutionCount":6,"positions":2880,"id":15}],"shapes":{"sq3":["111","111","111"],"rect23":["111","111"],"rect32":["11","11","11"],"rect24":["1111","1111"],"rect42":["11","11","11","11"],"L5":["100","100","111"],"L6":["110","110","100","100"],"L6b":["111","100","100","100"],"T5":["111","010","010"],"S6":["1100","0110","0011"],"plus5":["010","111","010"]}};
const N=6;
const COLORS=['','#ef6c79','#6a90ed','#a17bc6','#eec55c','#ee9b63','#69b8a8','#68617d'];
const WORDS={1:'赤',2:'青',3:'紫',4:'黄',5:'橙',6:'緑',7:'3色'};
const CONFIG={A:{title:'長方形 2枚',short:'2色 / 長方形',text:'長方形だけなら、赤と青の面積は重なり面積に連動して決まります。位置探し以上の推理があるか確かめよう。'},B:{title:'変形 2枚',short:'2色 / 変形',text:'L字やT字を加えます。重なる面積の数え方は複雑になりますが、条件はまだ実質1つです。'},C:{title:'3枚の重なり',short:'3色 / 3枚',text:'赤・青・黄の重なりを同時に調整。紫・橙・緑と、3枚すべて重なる場所も目標に含まれます。'}};
let mode='A',index=0,positions=[],selected=0,resultState=null,answerShown=false,drag=null;
let completed={};try{completed=JSON.parse(localStorage.getItem('color-overlap-completed-v1')||'{}')}catch(e){}
const $=id=>document.getElementById(id);
const canvas=$('board'),ctx=canvas.getContext('2d');
function stages(){return DATA.stages.filter(s=>s.mode===mode)}
function stage(){return stages()[index]}
function size(name){return DATA.shapes[name].reduce((k,row)=>k+[...row].filter(c=>c==='1').length,0)}
function cells(name,x,y){const set=new Set();DATA.shapes[name].forEach((row,yy)=>[...row].forEach((v,xx)=>{if(v==='1')set.add((yy+y)*N+(xx+x))}));return set}
function dims(name){const rows=DATA.shapes[name];return [rows[0].length,rows.length]}
function masks(){const m=Array(N*N).fill(0);const s=stage();positions.forEach(([x,y],i)=>{for(const k of cells(s.shapes[i],x,y))m[k]|=1<<i});return m}
function counts(m=masks()){const r=Array(stage().shapes.length===2?3:7).fill(0);for(const mask of m)if(mask)r[mask-1]++;return r}
function swatch(mask){return `<span class="swatch" style="background:${COLORS[mask]}"></span>`}
function renderMode(){ $('modes').innerHTML=['A','B','C'].map(m=>`<button class="mode ${m===mode?'active':''}" data-mode="${m}"><strong>${m}</strong><small>${CONFIG[m].short}</small></button>`).join('');$('modes').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>load(b.dataset.mode,0)))}
function renderSteps(){ $('steps').innerHTML=stages().map((s,i)=>`<button title="問題 ${i+1}" data-step="${i}" class="dot ${i===index?'active':''} ${completed[s.id]?'done':''}" aria-label="問題 ${i+1}"></button>`).join('');$('steps').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>load(mode,+b.dataset.step)))}
function renderTarget(){const c=stage().target;$('targets').className='targets'+(c.length===7?' seven':'');$('targets').innerHTML=c.map((n,i)=>`<div class="target">${swatch(i+1)}<span class="word">${WORDS[i+1]}</span><b>${n}</b></div>`).join('')}
function renderPieces(){const s=stage();$('pieces').innerHTML=s.shapes.map((name,i)=>`<button data-piece="${i}" class="piece ${selected===i?'active':''}">${swatch(1<<i)}<span>${WORDS[1<<i]} <small>${size(name)}マス</small></span></button>`).join('');$('pieces').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{selected=+b.dataset.piece;renderPieces();draw()}))}
function showResult(){const elem=$('result');if(!resultState){elem.className='result';elem.innerHTML='';return}const solved=resultState.solved,exemplar=answerShown;const target=stage().target;const current=counts();elem.className='result show '+(solved?'win':'');const title=exemplar?'配置例を表示しています':solved?'ぴったり！':'あと少し！';const subtitle=exemplar?'この配置なら目標の面積になります。自分でも動かして確かめられます。':solved?'すべての色の面積がそろいました。':'現在の面積と目標を比較してください。図形を動かすと表示は消えます。';elem.innerHTML=`<div class="result-title">${solved?'✓':'↗'} ${title}</div><p class="result-sub">${subtitle}</p><div class="scores ${target.length===7?'seven':''}">${target.map((value,i)=>`<div class="score ${value===current[i]?'good':'bad'}">${swatch(i+1)}<span>${WORDS[i+1]}</span><b>${current[i]}</b></div>`).join('')}</div>`}
function setResult(s){resultState=s;showResult();if(s?.solved && !answerShown){completed[stage().id]=true;try{localStorage.setItem('color-overlap-completed-v1',JSON.stringify(completed))}catch(e){}renderSteps()}$('judge').textContent=s?.solved?index===4?(mode==='C'?'最初の問題へ':'次のモードへ'):'次の問題へ':'答え合わせ'}
function draw(){const w=canvas.width,h=canvas.height,step=w/N,mask=masks();ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=mask[y*N+x],u=x*step,t=y*step;ctx.fillStyle=v?COLORS[v]:'#f4f6f9';const pad=v?2.2:3.2;roundRect(u+pad,t+pad,step-pad*2,step-pad*2,9);ctx.fill()}const active=1<<selected;ctx.save();ctx.strokeStyle='#283349';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(!(mask[y*N+x]&active))continue;let l=x*step,t=y*step,r=l+step,b=t+step,k=y*N+x;let check=(dx,dy)=>x+dx<0||x+dx>=N||y+dy<0||y+dy>=N||!(mask[k+dy*N+dx]&active);if(check(0,-1)){ctx.moveTo(l+4,t+4);ctx.lineTo(r-4,t+4)}if(check(0,1)){ctx.moveTo(l+4,b-4);ctx.lineTo(r-4,b-4)}if(check(-1,0)){ctx.moveTo(l+4,t+4);ctx.lineTo(l+4,b-4)}if(check(1,0)){ctx.moveTo(r-4,t+4);ctx.lineTo(r-4,b-4)}}ctx.stroke();ctx.restore()}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function load(m,i){mode=m;index=i;positions=stage().start.map(p=>p.slice());selected=0;resultState=null;answerShown=false;drag=null;$('modeLabel').textContent='EXPERIMENT '+mode;$('stageLabel').textContent=String(index+1).padStart(2,'0')+' / 05';$('compareTitle').textContent=mode+'｜'+CONFIG[mode].title;$('compareText').textContent=CONFIG[mode].text;$('sinfo').textContent='6×6 マス / 回転なし';$('showAnswer').textContent='配置例を見る';$('judge').textContent='答え合わせ';showResult();renderMode();renderSteps();renderTarget();renderPieces();draw()}
function enterMove(){if(resultState){resultState=null;answerShown=false;showResult();$('judge').textContent='答え合わせ';$('showAnswer').textContent='配置例を見る'}}
function xy(event){const b=canvas.getBoundingClientRect();const x=(event.clientX-b.left)/b.width*N;const y=(event.clientY-b.top)/b.height*N;return [x,y]}
canvas.addEventListener('pointerdown',e=>{const [x,y]=xy(e),ix=Math.floor(x),iy=Math.floor(y);if(ix<0||ix>=N||iy<0||iy>=N)return;const mask=masks()[iy*N+ix];if(!mask)return;if(!(mask&(1<<selected))){for(let i=positions.length-1;i>=0;i--)if(mask&(1<<i)){selected=i;break}renderPieces();draw()}drag={id:e.pointerId,startX:x,startY:y,origin:positions[selected].slice(),piece:selected,moved:false};canvas.setPointerCapture(e.pointerId);e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const [x,y]=xy(e);const dx=Math.round(x-drag.startX),dy=Math.round(y-drag.startY);const [bw,bh]=dims(stage().shapes[drag.piece]);const nx=Math.max(0,Math.min(N-bw,drag.origin[0]+dx));const ny=Math.max(0,Math.min(N-bh,drag.origin[1]+dy));if(nx!==positions[drag.piece][0]||ny!==positions[drag.piece][1]){positions[drag.piece]=[nx,ny];drag.moved=true;enterMove();draw()}e.preventDefault()});
function stopDrag(e){if(drag&&e.pointerId===drag.id)drag=null}
canvas.addEventListener('pointerup',stopDrag);canvas.addEventListener('pointercancel',stopDrag);
$('judge').addEventListener('click',()=>{if(resultState?.solved){if(index<4)load(mode,index+1);else if(mode==='C')load('A',0);else load(mode==='A'?'B':'C',0);return}setResult({solved:counts().every((n,i)=>n===stage().target[i])})});
$('reset').addEventListener('click',()=>load(mode,index));
$('showAnswer').addEventListener('click',()=>{positions=stage().answer.map(p=>p.slice());answerShown=true;setResult({solved:true});$('showAnswer').textContent='配置例を表示中';draw()});
window.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const delta={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];const [bw,bh]=dims(stage().shapes[selected]);const [x,y]=positions[selected];const nx=Math.max(0,Math.min(N-bw,x+delta[0])),ny=Math.max(0,Math.min(N-bh,y+delta[1]));if(nx!==x||ny!==y){positions[selected]=[nx,ny];enterMove();draw()}});
load('A',0);
</script>
</body>
</html>
